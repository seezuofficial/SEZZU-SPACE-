<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090b12"><title>Private Login — Season Space</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><main class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">S.</span><span>SEASON<span class="brand-dot">/</span>SPACE</span></a><h1>Private space.</h1><p>Sign in to open your personal dashboard.</p>
